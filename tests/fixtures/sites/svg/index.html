<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVG com script – teste de limpeza</title>
  <link rel="stylesheet" href="/estilo.css">
</head>
<body>
  <h1>Página com SVGs</h1>
  <p>O ícone é um SVG comum. O selo é um SVG com script e atributos onload/onclick, que no ZIP
  ficaria no domínio do usuário: a cópia guarda o selo sem nada que rode código.</p>
  <img class="icone" src="/img/icone.svg" alt="Ícone" width="48" height="48">
  <img class="selo" src="/img/selo.svg" alt="Selo" width="160" height="80">
  <div class="faixa">Faixa com o selo de fundo</div>
</body>
</html>
