<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Descubra o seu estilo</title>
  <link rel="stylesheet" href="/css.css">
</head>
<body>
  <header class="topo">
    <img src="/img/logo.svg" alt="Loja Estilo" width="140" height="36">
    <a class="conta" href="/minha-conta">Minha conta</a>
  </header>
  <main class="quiz">
    <div id="etapa" data-etapa="0">
      <h1>Descubra o seu estilo em 3 perguntas</h1>
      <p>Responda o quiz e ganhe um giro na roleta de descontos.</p>
      <button class="cta" type="button" id="comecar">Começar o quiz</button>
    </div>
  </main>
  <footer class="rodape">
    <a href="/politica-de-privacidade">Política de privacidade</a>
  </footer>
  <script src="/js/quiz.js"></script>
</body>
</html>
