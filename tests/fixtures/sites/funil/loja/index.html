<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Descubra o seu estilo</title>
  <link rel="stylesheet" href="/css.css">
</head>
<body>
  <header class="topo">
    <a href="/loja/"><img src="/img/logo.svg" alt="Loja Estilo" width="140" height="36"></a>
    <a href="/carrinho">Carrinho</a>
  </header>
  <main class="loja">
    <h1>Ofertas com 30% OFF</h1>
    <div class="cards">
      <a class="card" href="/produto/camiseta-azul"><img src="/img/camiseta.svg" alt=""><h3>Camiseta Azul</h3><p class="preco">R$ 79,90</p></a>
      <a class="card" href="__ORIGIN__/produto/bermuda-jeans"><img src="/img/bermuda.svg" alt=""><h3>Bermuda Jeans</h3><p class="preco">R$ 119,90</p></a>
      <a class="card" href="/produto/tenis-branco"><img src="/img/tenis.svg" alt=""><h3>Tênis Branco</h3><p class="preco">R$ 249,90</p></a>
      <div class="card" onclick="location.href='/produto/bone-preto'"><img src="/img/bone.svg" alt=""><h3>Boné Preto</h3><p class="preco">R$ 59,90</p></div>
    </div>
  </main>
  <footer class="rodape"><a href="/politica-de-privacidade">Política de privacidade</a></footer>
</body>
</html>
